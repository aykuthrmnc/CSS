<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deadpool | https://cssbattle.dev/play/204</title>
    <style>
      body {
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .wrapper {
        position: relative;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f3ac3c;
      }
      .head {
        position: absolute;
        /* top: 54px; left:100px; */
        top: 50%;
        left: 50%;
        width: 12.5em;
        height: 12.5em;
        background: #9f3333;
        border-radius: 50%;
        translate: -50% -50%;
      }
      .eye-wrapper {
        position: absolute;
        top: 1.0625em;
        left: 1.0625em;
        width: 10.375em;
        height: 10.375em;
        background: #000000;
        border-radius: 50%;
      }
      .line {
        position: absolute;
        top: 0px;
        left: 4.0625em;
        width: 2.25em;
        height: 100%;
        background: #9f3333;
      }

      .eye {
        position: absolute;
        top: 4.4375em;
        width: 1.8125em;
        height: 0.875em;
        background: #ffffff;
        border-bottom-left-radius: 1.8125em;
        border-bottom-right-radius: 1.8125em;
      }

      .eye.left {
        left: 1.125em;
        rotate: 29deg;
      }
      .eye.right {
        right: 1.1875em;
        rotate: -28deg;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="head">
        <div class="eye-wrapper">
          <div class="eye left"></div>
          <div class="line"></div>
          <div class="eye right"></div>
        </div>
      </div>
    </div>
  </body>
</html>
